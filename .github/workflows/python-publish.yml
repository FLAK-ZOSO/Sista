# This workflow will upload a Python Package to PyPI when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check-pypi-version:
    runs-on: ubuntu-latest
    outputs:
      version_exists: ${{ steps.check.outputs.version_exists }}

    steps:
      - uses: actions/checkout@v4

      - id: check
        name: Check whether this version is already on PyPI
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 scripts/check_release_version.py "$RELEASE_TAG"
          version=$(sed -n "s/^__version__ = ['\"]\([^'\"]*\)['\"]$/\1/p" python/src/sista/__init__.py)
          test -n "$version"
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://pypi.org/pypi/sista/$version/json")

          if [ "$status" = 200 ]; then
            echo "Sista $version is already published on PyPI; skipping build and upload."
            echo "version_exists=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = 404 ]; then
            echo "Sista $version is not yet published on PyPI."
            echo "version_exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Could not check PyPI for Sista $version (HTTP $status)." >&2
            exit 1
          fi

  release-build:
    runs-on: ubuntu-latest
    needs: check-pypi-version
    if: needs.check-pypi-version.outputs.version_exists != 'true'

    steps:
      - uses: actions/checkout@v4
    
      - name: Install the sista library
        run: |
          sudo PREFIX=/usr/local make install

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build release distributions
        run: |
          cd python
          python -m pip install build
          python -m build --sdist
    
      - name: Install cibuildwheel
        run: |
          cd python
          python -m pip install cibuildwheel

      - name: Build wheels
        # https://cibuildwheel.pypa.io/en/stable/configuration/#environment-variables
        run: |
          cd python
          cibuildwheel --output-dir wheelhouse

      - name: Upload wheels (linux)
        uses: actions/upload-artifact@v4
        with:
          name: release-wheels-linux
          path: python/wheelhouse/

      - name: Upload source and wheel distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: |
            python/dist/

