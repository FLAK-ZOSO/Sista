  release-build-macos:
    runs-on: macos-latest
    needs: check-pypi-version
    if: needs.check-pypi-version.outputs.version_exists != 'true'
    # macos-latest currently uses a newer SDK than the wheel's deployment
    # target. This must apply while building Sista itself, not only while
    # cibuildwheel compiles the Python extension.
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"

    steps:
      - uses: actions/checkout@v4

      - name: Create local install prefix
        run: mkdir -p python/_install

      - name: Install the sista library into local prefix
        run: |
          make install PREFIX=${{ github.workspace }}/python/_install

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install cibuildwheel
        run: |
          python -m pip install cibuildwheel

      - name: Build wheels
        env:
          PREFIX: ${{ github.workspace }}/python/_install
          CPPFLAGS: -I${{ github.workspace }}/python/_install/include
          CFLAGS: -I${{ github.workspace }}/python/_install/include
          LDFLAGS: -L${{ github.workspace }}/python/_install/lib -Wl,-rpath,${{ github.workspace }}/python/_install/lib
          PKG_CONFIG_PATH: ${{ github.workspace }}/python/_install/lib/pkgconfig
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/python/_install/lib
          CIBW_BEFORE_BUILD_MACOS: "" # To prevent cibuildwheel from trying to install Sista again
        run: |
          cd python
          cibuildwheel --output-dir wheelhouse

      - name: Upload wheels (macos)
        uses: actions/upload-artifact@v4
        with:
          name: release-wheels-macos
          path: python/wheelhouse/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - check-pypi-version
      - release-build
      - release-build-macos
    if: needs.check-pypi-version.result == 'success' && needs.check-pypi-version.outputs.version_exists != 'true' && needs.release-build.result == 'success' && needs.release-build-macos.result == 'success'
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/project/sista

    steps:
      - name: Retrieve wheels (linux)
        uses: actions/download-artifact@v4
        with:
          name: release-wheels-linux
          path: python/wheelhouse/

      # - name: Retrieve wheels (windows)
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: release-wheels-windows
      #     path: python/wheelhouse/

      - name: Retrieve wheels (macos)
        uses: actions/download-artifact@v4
        with:
          name: release-wheels-macos
          path: python/wheelhouse/

      - name: Retrieve dists
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: python/dist/

      - name: Move dists to wheelhouse
        run: |
          mv python/dist/* python/wheelhouse/

      - name: Publish wheels to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/wheelhouse/
          # A concurrent publish between the check above and this step is not
          # an error; leave the existing distributions untouched.
          skip-existing: true
